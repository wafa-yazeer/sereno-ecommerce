# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Information
spring.application.name=sereno-ecommerce-api

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:serenodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Springdoc OpenAPI 3.0 / Swagger UI Configuration
# Swagger UI available at: http://localhost:8080/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.sereno.ecommerce=DEBUG
logging.level.org.hibernate.SQL=DEBUG
